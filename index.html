<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>思想道德与法治（2025.4.9）線上刷題系統</title>
    <style>
        /* ==========================================
           純原生 CSS 樣式表（零外部依賴，適配離線與中國大陸網路）
           ========================================== */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-muted: #f1f5f9;
            --bg-hover: #e2e8f0;
            --border-color: #e2e8f0;
            --border-strong: #cbd5e1;
            --text-main: #0f172a;
            --text-sub: #475569;
            --text-muted: #94a3b8;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --primary-border: #c7d2fe;
            --success: #059669;
            --success-soft: #ecfdf5;
            --success-border: #10b981;
            --danger: #e11d48;
            --danger-soft: #fff1f2;
            --danger-border: #f43f5e;
            --warning: #b45309;
            --warning-soft: #fffbeb;
            --warning-border: #fde68a;
            --purple: #7e22ce;
            --purple-soft: #f3e8ff;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.15);
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            outline: none;
        }

        .hidden {
            display: none !important;
        }

        /* 自定義滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-muted);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 4px;
        }

        /* 頂部導航欄 */
        .app-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 30;
            box-shadow: var(--shadow-sm);
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 16px;
        }

        .header-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* 統計膠囊 */
        .stats-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            background: var(--bg-muted);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .stat-divider {
            width: 1px;
            height: 14px;
            background: var(--border-strong);
        }

        .text-bold { font-weight: 700; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-primary { color: var(--primary); }

        /* 工具與模式切換列 */
        .header-toolbar {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--bg-muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .mode-group, .action-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .btn-tab {
            padding: 6px 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            background: var(--bg-muted);
            color: var(--text-sub);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-tab:hover {
            background: var(--bg-hover);
        }

        .btn-tab.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        .btn-tab.wrong-tab {
            color: var(--danger);
        }

        .btn-tab.wrong-tab:hover {
            background: var(--danger-soft);
        }

        .btn-tab.wrong-tab.active {
            background: var(--danger);
            color: #ffffff;
        }

        .wrong-count-badge {
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            background: #ffe4e6;
            color: var(--danger);
        }

        .btn-tab.wrong-tab.active .wrong-count-badge {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        .btn-tool {
            padding: 6px 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .btn-tool:hover {
            background: var(--bg-muted);
        }

        .btn-tool.recite-on {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
        }

        .recite-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-strong);
        }

        .btn-tool.recite-on .recite-dot {
            background: var(--primary);
        }

        .btn-shuffle {
            background: var(--warning-soft);
            color: var(--warning);
            border-color: var(--warning-border);
        }

        .btn-shuffle:hover {
            background: #fef3c7;
        }

        .btn-drawer {
            background: #1e293b;
            color: #ffffff;
            border-color: #1e293b;
        }

        .btn-drawer:hover {
            background: #334155;
        }

        /* 輕量 Toast 提示 */
        .toast-container {
            position: fixed;
            top: 76px;
            left: 50%;
            transform: translate(-50%, -10px);
            z-index: 60;
            pointer-events: none;
            opacity: 0;
            transition: all 0.25s ease;
        }

        .toast-container.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast-msg {
            background: rgba(15, 23, 42, 0.92);
            color: #ffffff;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: var(--shadow-md);
            white-space: nowrap;
        }

        /* 主作答區域 */
        .main-wrap {
            flex: 1;
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: 20px 16px 32px;
            display: flex;
            flex-direction: column;
        }

        /* 空錯題本卡片 */
        .empty-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 44px 24px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            margin: auto 0;
        }

        .empty-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--success-soft);
            color: var(--success);
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        /* 題目主卡片 */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .quiz-card-header {
            padding: 14px 22px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .quiz-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .q-index {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }

        .q-type-tag {
            padding: 2px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .q-type-single {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .q-type-multi {
            background: var(--purple-soft);
            color: var(--purple);
        }

        .q-orig {
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-remove-wrong {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid #a7f3d0;
        }

        .btn-remove-wrong:hover {
            background: #d1fae5;
        }

        .quiz-body {
            padding: 22px;
        }

        .q-stem {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.65;
            margin-bottom: 20px;
            word-break: break-word;
        }

        /* 選項列表 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .option-item {
            padding: 13px 16px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            transition: all 0.16s ease;
            user-select: none;
        }

        .option-item:hover:not(.disabled) {
            border-color: #a5b4fc;
            background: #f8fafc;
        }

        .option-item:active:not(.disabled) {
            transform: scale(0.992);
        }

        .option-item.disabled {
            cursor: default;
            color: var(--text-sub);
        }

        .option-item.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: #1e1b4b;
            font-weight: 500;
        }

        .option-item.correct {
            border-color: var(--success-border);
            background: var(--success-soft);
            color: #064e3b;
            font-weight: 500;
        }

        .option-item.wrong {
            border-color: var(--danger-border);
            background: var(--danger-soft);
            color: #881337;
        }

        .opt-badge {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--bg-muted);
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.16s ease;
        }

        .option-item.selected .opt-badge {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .option-item.correct .opt-badge {
            background: var(--success);
            border-color: var(--success);
            color: #ffffff;
        }

        .option-item.wrong .opt-badge {
            background: var(--danger);
            border-color: var(--danger);
            color: #ffffff;
        }

        .opt-text {
            font-size: 15px;
            line-height: 1.55;
            flex: 1;
            word-break: break-word;
        }

        .opt-status {
            font-size: 13px;
            font-weight: 700;
            margin-left: auto;
            white-space: nowrap;
            padding-top: 2px;
        }

        .opt-status.ok { color: var(--success); }
        .opt-status.err { color: var(--danger); }

        /* 多選提交按鈕 */
        .multi-submit-area {
            margin-top: 20px;
        }

        .btn-primary {
            padding: 10px 22px;
            border-radius: var(--radius-md);
            background: var(--primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
            transition: background 0.15s ease;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* 結果反饋框 */
        .feedback-panel {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .feedback-panel.info {
            background: var(--primary-soft);
            border-color: var(--primary-border);
            color: #1e1b4b;
        }

        .feedback-panel.ok {
            background: var(--success-soft);
            border-color: #a7f3d0;
            color: #064e3b;
        }

        .feedback-panel.err {
            background: var(--danger-soft);
            border-color: #fecdd3;
            color: #881337;
        }

        .feedback-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .feedback-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
        }

        .feedback-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            color: #ffffff;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-panel.info .feedback-dot { background: var(--primary); }
        .feedback-panel.ok .feedback-dot { background: var(--success); }
        .feedback-panel.err .feedback-dot { background: var(--danger); }

        .feedback-ans {
            font-size: 14px;
            font-weight: 500;
        }

        .feedback-ans strong {
            font-size: 16px;
            color: var(--success);
            letter-spacing: 1px;
        }

        .feedback-user {
            font-size: 12px;
            margin-top: 6px;
            opacity: 0.85;
        }

        /* 底部導航列 */
        .quiz-footer {
            padding: 14px 22px;
            background: #f8fafc;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .btn-nav {
            padding: 9px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--bg-muted);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .shortcut-hint {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        kbd {
            padding: 2px 5px;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-sub);
            font-family: monospace;
        }

        /* 答題卡抽屜 Modal */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            justify-content: flex-end;
        }

        .drawer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
        }

        .drawer-panel {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            height: 100%;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .drawer-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-title {
            font-size: 16px;
            font-weight: 700;
        }

        .drawer-sub {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .btn-close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close:hover {
            background: var(--bg-muted);
        }

        .drawer-legend {
            padding: 10px 16px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }

        .legend-items {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
            margin-right: 4px;
        }

        .btn-clear-wrong {
            color: var(--danger);
            font-weight: 600;
            font-size: 12px;
        }

        .btn-clear-wrong:hover {
            text-decoration: underline;
        }

        .drawer-grid {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            align-content: start;
        }

        .grid-cell {
            height: 36px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            background: var(--bg-muted);
            color: var(--text-sub);
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s ease;
        }

        .grid-cell:hover {
            background: var(--bg-hover);
        }

        .grid-cell.cell-ok {
            background: var(--success);
            color: #ffffff;
        }

        .grid-cell.cell-err {
            background: var(--danger);
            color: #ffffff;
        }

        .grid-cell.cell-current {
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--primary);
        }

        /* 手機端自適應優化 */
        @media (max-width: 640px) {
            .shortcut-hint {
                display: none;
            }
            .quiz-card-header, .quiz-body, .quiz-footer {
                padding-left: 16px;
                padding-right: 16px;
            }
            .q-stem {
                font-size: 16px;
            }
            .opt-text {
                font-size: 14px;
            }
            .multi-submit-area .btn-primary {
                width: 100%;
            }
            .stats-pill {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部導航與統計區 -->
    <header class="app-header">
        <div class="header-inner">
            <div class="header-top">
                <div class="brand">
                    <div class="brand-logo">法</div>
                    <div>
                        <h1 class="brand-title">思想道德与法治题库</h1>
                        <p class="brand-sub">2025.4.9 版 · 題目與選項雙重隨機亂序</p>
                    </div>
                </div>

                <!-- 即時統計 -->
                <div class="stats-pill">
                    <div class="stat-item">
                        <span style="color: var(--text-sub);">進度:</span>
                        <span id="stat-progress" class="text-bold">0/0</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item text-success">
                        <span>對:</span>
                        <span id="stat-correct" class="text-bold">0</span>
                    </div>
                    <div class="stat-item text-danger">
                        <span>錯:</span>
                        <span id="stat-wrong" class="text-bold">0</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item text-primary">
                        <span>正確率:</span>
                        <span id="stat-rate" class="text-bold">0%</span>
                    </div>
                </div>
            </div>

            <!-- 模式與功能按鈕列 -->
            <div class="header-toolbar">
                <div class="mode-group">
                    <button onclick="switchMode('all')" data-mode="all" class="btn-tab active">全部題庫 (274)</button>
                    <button onclick="switchMode('single')" data-mode="single" class="btn-tab">單選題 (179)</button>
                    <button onclick="switchMode('multi')" data-mode="multi" class="btn-tab">多選題 (95)</button>
                    <button onclick="switchMode('wrong')" data-mode="wrong" class="btn-tab wrong-tab">
                        <span>錯題本</span>
                        <span id="wrong-badge" class="wrong-count-badge">0</span>
                    </button>
                </div>

                <div class="action-group">

        const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

        function parseQuestionBank(rawText) {
            const lines = rawText.trim().split('\n').map(l => l.trim()).filter(Boolean);
            const questions = [];
            let currentType = 'single';

            lines.forEach(line => {
                if (line === '[SINGLE]') { currentType = 'single'; return; }
                if (line === '[MULTI]') { currentType = 'multi'; return; }

                const parts = line.split('|');
                if (parts.length < 4) return;

                const origNum = parts[0];
                const stem = parts[1];
                const ansStr = parts[parts.length - 1].toUpperCase();
                const optionTexts = parts.slice(2, parts.length - 1);

                const options = optionTexts.map((text, idx) => ({
                    text: text,
                    isCorrect: ansStr.includes(LETTERS[idx])
                }));

                questions.push({
                    uid: `${currentType}_${origNum}`,
                    type: currentType,
                    origNum: origNum,
                    stem: stem,
                    options: options
                });
            });
            return questions;
        }

        const ALL_QUESTIONS = parseQuestionBank(RAW_BANK_TEXT);

        // ==========================================
        // 2. 狀態管理與 Fisher-Yates 隨機洗牌
        // ==========================================
        const STORAGE_WRONG_KEY = 'ideology_law_2025_wrong_uids';

        const state = {
            mode: 'all',
            reciteMode: false,
            activeList: [],
            currentIndex: 0,
            records: {},
            wrongUids: new Set()
        };

        function loadWrongUids() {
            try {
                const saved = localStorage.getItem(STORAGE_WRONG_KEY);
                if (saved) {
                    const arr = JSON.parse(saved);
                    if (Array.isArray(arr)) state.wrongUids = new Set(arr);
                }
            } catch (e) {}
            updateWrongBadge();
        }

        function saveWrongUids() {
            try {
                localStorage.setItem(STORAGE_WRONG_KEY, JSON.stringify([...state.wrongUids]));
            } catch (e) {}
            updateWrongBadge();
        }

        function updateWrongBadge() {
            document.getElementById('wrong-badge').textContent = state.wrongUids.size;
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function buildShuffledSession(mode) {
            let source = ALL_QUESTIONS;
            if (mode === 'single') source = ALL_QUESTIONS.filter(q => q.type === 'single');
            else if (mode === 'multi') source = ALL_QUESTIONS.filter(q => q.type === 'multi');
            else if (mode === 'wrong') source = ALL_QUESTIONS.filter(q => state.wrongUids.has(q.uid));

            const shuffledQuestions = shuffleArray(source);
            return shuffledQuestions.map(q => {
                const shuffledOpts = shuffleArray(q.options).map((opt, idx) => ({
                    label: LETTERS[idx],
                    text: opt.text,
                    isCorrect: opt.isCorrect
                }));
                const correctLabels = shuffledOpts.filter(o => o.isCorrect).map(o => o.label);
                return {
                    ...q,
                    shuffledOptions: shuffledOpts,
                    correctLabels: correctLabels
                };
            });
        }

        // ==========================================
        // 3. 模式切換與互動控制
        // ==========================================
        function switchMode(newMode) {
            state.mode = newMode;
            state.currentIndex = 0;
            state.records = {};
            state.activeList = buildShuffledSession(newMode);

            document.querySelectorAll('.btn-tab').forEach(btn => {
                if (btn.dataset.mode === newMode) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            renderQuestion();
            updateStats();
        }

        function reshuffleCurrentMode() {
            state.currentIndex = 0;
            state.records = {};
            state.activeList = buildShuffledSession(state.mode);
            renderQuestion();
            updateStats();
            showToast('已重新隨機打亂題目與選項順序！');
        }

        function toggleReciteMode() {
            state.reciteMode = !state.reciteMode;
            const btn = document.getElementById('recite-toggle');
            if (state.reciteMode) {
                btn.classList.add('recite-on');
                showToast('已開啟背題模式（直接顯示答案）');
            } else {
                btn.classList.remove('recite-on');
                showToast('已切換回作答模式');
            }
            renderQuestion();
        }

        function renderQuestion() {
            const emptyView = document.getElementById('empty-wrong-view');
            const quizContainer = document.getElementById('quiz-container');

            if (state.activeList.length === 0) {
                emptyView.classList.remove('hidden');
                quizContainer.classList.add('hidden');
                return;
            }

            emptyView.classList.add('hidden');
            quizContainer.classList.remove('hidden');

            const q = state.activeList[state.currentIndex];
            const rec = state.records[q.uid] || { selected: new Set(), submitted: false, isCorrect: false };
            const isRevealed = state.reciteMode || rec.submitted;

            document.getElementById('q-index-badge').textContent = `第 ${state.currentIndex + 1} / ${state.activeList.length} 題`;
            const typeBadge = document.getElementById('q-type-badge');
            if (q.type === 'single') {
                typeBadge.textContent = '單項選擇題';
                typeBadge.className = 'q-type-tag q-type-single';
            } else {
                typeBadge.textContent = '多項選擇題';
                typeBadge.className = 'q-type-tag q-type-multi';
            }
            document.getElementById('q-orig-id').textContent = `原題號: ${q.type === 'single' ? '單選' : '多選'} #${q.origNum}`;

            const removeWrongBtn = document.getElementById('remove-wrong-btn');
            if (state.wrongUids.has(q.uid)) removeWrongBtn.classList.remove('hidden');
            else removeWrongBtn.classList.add('hidden');

            document.getElementById('q-stem').textContent = q.stem;

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            q.shuffledOptions.forEach(opt => {
                const isSelected = rec.selected.has(opt.label);
                let extraClass = '';
                let statusHtml = '';

                if (isRevealed) {
                    extraClass = 'disabled';
                    if (opt.isCorrect) {
                        extraClass += ' correct';
                        statusHtml = '<span class="opt-status ok">✓ 正確</span>';
                    } else if (isSelected && !opt.isCorrect) {
                        extraClass += ' wrong';
                        statusHtml = '<span class="opt-status err">✗ 誤選</span>';
                    }
                } else if (isSelected) {
                    extraClass = 'selected';
                }

                const item = document.createElement('div');
                item.className = `option-item ${extraClass}`;
                item.innerHTML = `
                    <span class="opt-badge">${opt.label}</span>
                    <span class="opt-text">${opt.text}</span>
                    ${statusHtml}
                `;

                if (!isRevealed) {
                    item.onclick = () => handleOptionClick(opt.label);
                }
                optionsList.appendChild(item);
            });

            const multiSubmitWrap = document.getElementById('multi-submit-wrap');
            if (q.type === 'multi' && !isRevealed) multiSubmitWrap.classList.remove('hidden');
            else multiSubmitWrap.classList.add('hidden');

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackCorrectAns = document.getElementById('feedback-correct-ans');
            const feedbackUserAns = document.getElementById('feedback-user-ans');

            if (isRevealed) {
                feedbackBox.classList.remove('hidden');
                feedbackCorrectAns.textContent = q.correctLabels.join('、');

                if (state.reciteMode && !rec.submitted) {
                    feedbackBox.className = 'feedback-panel info';
                    feedbackIcon.textContent = 'i';
                    feedbackTitle.textContent = '背題模式 · 參考答案';
                    feedbackUserAns.classList.add('hidden');
                } else if (rec.isCorrect) {
                    feedbackBox.className = 'feedback-panel ok';
                    feedbackIcon.textContent = '✓';
                    feedbackTitle.textContent = '回答正確！';
                    feedbackUserAns.classList.add('hidden');
                } else {
                    feedbackBox.className = 'feedback-panel err';
                    feedbackIcon.textContent = '✗';
                    feedbackTitle.textContent = '回答錯誤（已自動加入錯題本）';
                    const userPicked = [...rec.selected].sort().join('、') || '未選擇';
                    feedbackUserAns.textContent = `你的選擇：${userPicked}`;
                    feedbackUserAns.classList.remove('hidden');
                }
            } else {
                feedbackBox.classList.add('hidden');
            }

            document.getElementById('prev-btn').disabled = state.currentIndex === 0;
            document.getElementById('next-btn').disabled = state.currentIndex >= state.activeList.length - 1;
            updateStats();
        }

        function handleOptionClick(label) {
            const q = state.activeList[state.currentIndex];
            if (!q) return;

            if (!state.records[q.uid]) {
                state.records[q.uid] = { selected: new Set(), submitted: false, isCorrect: false };
            }
            const rec = state.records[q.uid];
            if (rec.submitted || state.reciteMode) return;

            if (q.type === 'single') {
                rec.selected = new Set([label]);
                evaluateAnswer(q, rec);
            } else {
                if (rec.selected.has(label)) rec.selected.delete(label);
                else rec.selected.add(label);
                renderQuestion();
            }
        }

        function submitMultiAnswer() {
            const q = state.activeList[state.currentIndex];
            if (!q || q.type !== 'multi') return;

            const rec = state.records[q.uid];
            if (!rec || rec.selected.size === 0) {
                showToast('請至少選擇一個選項後再提交！');
                return;
            }
            evaluateAnswer(q, rec);
        }

        function evaluateAnswer(q, rec) {
            rec.submitted = true;
            const userArr = [...rec.selected].sort();
            const correctArr = [...q.correctLabels].sort();

            const isCorrect = userArr.length === correctArr.length &&
                userArr.every((val, idx) => val === correctArr[idx]);

            rec.isCorrect = isCorrect;

            if (!isCorrect) {
                state.wrongUids.add(q.uid);
                saveWrongUids();
            }

            renderQuestion();
        }

        function removeCurrentFromWrong() {
            const q = state.activeList[state.currentIndex];
            if (!q) return;
            state.wrongUids.delete(q.uid);
            saveWrongUids();
            showToast('已從錯題本移除該題');

            if (state.mode === 'wrong') {
                state.activeList.splice(state.currentIndex, 1);
                if (state.currentIndex >= state.activeList.length) {
                    state.currentIndex = Math.max(0, state.activeList.length - 1);
                }
            }
            renderQuestion();
        }

        function clearAllWrong() {
            if (state.wrongUids.size === 0) {
                showToast('錯題本已經是空的了');
                return;
            }
            state.wrongUids.clear();
            saveWrongUids();
            showToast('已清空所有錯題記錄');
            if (state.mode === 'wrong') {
                switchMode('wrong');
            } else {
                renderQuestion();
                renderDrawerGrid();
            }
        }

        function prevQuestion() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (state.currentIndex < state.activeList.length - 1) {
                state.currentIndex++;
                renderQuestion();
            } else {
                showToast('已經是最後一題囉！');
            }
        }

        function jumpToQuestion(idx) {
            state.currentIndex = idx;
            renderQuestion();
            toggleDrawer();
        }

        function updateStats() {
            const total = state.activeList.length;
            let correctCount = 0;
            let wrongCount = 0;

            state.activeList.forEach(q => {
                const rec = state.records[q.uid];
                if (rec && rec.submitted) {
                    if (rec.isCorrect) correctCount++;
                    else wrongCount++;
                }
            });

            const answered = correctCount + wrongCount;
            const rate = answered === 0 ? 0 : Math.round((correctCount / answered) * 100);

            document.getElementById('stat-progress').textContent = `${total === 0 ? 0 : state.currentIndex + 1}/${total}`;
            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-wrong').textContent = wrongCount;
            document.getElementById('stat-rate').textContent = `${rate}%`;
        }

        function toggleDrawer() {
            const modal = document.getElementById('drawer-modal');
            if (modal.classList.contains('hidden')) {
                renderDrawerGrid();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderDrawerGrid() {
            const grid = document.getElementById('drawer-grid');
            grid.innerHTML = '';

            state.activeList.forEach((q, idx) => {
                const rec = state.records[q.uid];
                let cls = 'grid-cell';
                if (rec && rec.submitted) {
                    cls += rec.isCorrect ? ' cell-ok' : ' cell-err';
                }
                if (idx === state.currentIndex) {
                    cls += ' cell-current';
                }

                const cell = document.createElement('button');
                cell.className = cls;
                cell.textContent = idx + 1;
                cell.onclick = () => jumpToQuestion(idx);
                grid.appendChild(cell);
            });
        }

        let toastTimer = null;
        function showToast(msg) {
            const box = document.getElementById('toast-box');
            const text = document.getElementById('toast-text');
            text.textContent = msg;
            box.classList.add('show');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                box.classList.remove('show');
            }, 2200);
        }

        document.addEventListener('keydown', (e) => {
            const drawerOpen = !document.getElementById('drawer-modal').classList.contains('hidden');
            if (drawerOpen) {
                if (e.key === 'Escape') toggleDrawer();
                return;
            }

            if (state.activeList.length === 0) return;
            const q = state.activeList[state.currentIndex];
            const rec = state.records[q.uid];

            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextQuestion();
            } else if (['1', '2', '3', '4', '5'].includes(e.key)) {
                const idx = parseInt(e.key, 10) - 1;
                if (q.shuffledOptions[idx]) {
                    handleOptionClick(q.shuffledOptions[idx].label);
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (q.type === 'multi' && (!rec || !rec.submitted) && !state.reciteMode) {
                    submitMultiAnswer();
                } else {
                    nextQuestion();
                }
            }
        });

        window.onload = function() {
            loadWrongUids();
            switchMode('all');
        };
    </script>
